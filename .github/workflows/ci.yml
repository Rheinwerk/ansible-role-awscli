---
# Lint, molecule and the Galaxy release on tags come from the reusable workflow in
# Rheinwerk/molecule, see its README.md for the inputs.
# TEMPORARY: @reusable-workflow and molecule_ref 'reusable-workflow' until Rheinwerk/molecule#18
# is merged, then both become main.
name: CI

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: Run molecule even if only ignored files changed
        type: boolean
        default: false
      molecule_debug:
        description: Open a tmate session right before molecule runs
        type: boolean
        default: false
      args:
        description: Additional arguments passed to molecule test
        type: string
        default: ''
      molecule_ref:
        description: Ref of Rheinwerk/molecule to take the action and scenario from
        type: string
        default: reusable-workflow
  pull_request:
  push:
  schedule:
    - cron: '30 1 * * 3'

jobs:
  ci:
    uses: Rheinwerk/molecule/.github/workflows/role.yml@reusable-workflow
    with:
      # format() turns the dispatch booleans into 'true'/'false' ('' on push, pull request and schedule)
      force_run: ${{ format('{0}', inputs.force_run) }}
      molecule_debug: ${{ format('{0}', inputs.molecule_debug) }}
      args: ${{ inputs.args }}
      molecule_ref: ${{ inputs.molecule_ref || 'reusable-workflow' }}
    # passes GALAXY_API_KEY for the release job
    secrets: inherit
